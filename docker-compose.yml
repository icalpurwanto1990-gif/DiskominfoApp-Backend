services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    restart: always
    volumes:
      - ./.env:/var/www/html/.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-diskominfo_db}
      - DB_USERNAME=${DB_USERNAME:-diskominfo_admin}
      - DB_PASSWORD=${DB_PASSWORD:-SecretPassword2026}
      - LOG_CHANNEL=stack

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_DB=${DB_DATABASE:-diskominfo_db}
      - POSTGRES_USER=${DB_USERNAME:-diskominfo_admin}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-SecretPassword2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-diskominfo_admin} -d ${DB_DATABASE:-diskominfo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
