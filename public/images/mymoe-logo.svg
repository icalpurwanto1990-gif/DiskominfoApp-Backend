<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient for MY MOE & 101.1 FM -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfb75c" />
      <stop offset="30%" stop-color="#f6e297" />
      <stop offset="70%" stop-color="#c99732" />
      <stop offset="100%" stop-color="#a6771e" />
    </linearGradient>

    <!-- Drop Shadow for Text -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#543806" flood-opacity="0.3" />
    </filter>

    <!-- Metallic bevel filter -->
    <filter id="subtleBevel" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0.5" dy="1" stdDeviation="0.5" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <g transform="translate(10, 20)">
    <!-- Text: MY -->
    <text x="80" y="125" font-family="'Montserrat', 'Arial Black', 'Segoe UI', sans-serif" font-size="76" font-weight="900" letter-spacing="4" fill="url(#goldGrad)" filter="url(#goldGlow)">MY</text>

    <!-- Text: MOE -->
    <text x="245" y="125" font-family="'Montserrat', 'Arial Black', 'Segoe UI', sans-serif" font-size="76" font-weight="900" letter-spacing="4" fill="url(#goldGrad)" filter="url(#goldGlow)">MOE</text>

    <!-- Purple Pulse / Frequency Wave -->
    <path d="M 75 142 
             L 175 142 
             L 185 133 
             L 194 160 
             L 204 122 
             L 216 195 
             L 226 40 
             L 237 205 
             L 246 142 
             L 254 170 
             L 262 130 
             L 272 142 
             L 425 142" 
          fill="none" 
          stroke="#4a154b" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Text: 101.1 FM -->
    <text x="280" y="186" font-family="'Montserrat', 'Arial Black', 'Segoe UI', sans-serif" font-size="38" font-weight="900" letter-spacing="2" fill="url(#goldGrad)" filter="url(#goldGlow)">101.1 FM</text>
  </g>
</svg>
